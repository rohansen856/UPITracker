name: receipt
description: "Unified UPI payment tracker - reads notifications & SMS to consolidate all UPI spending and receiving."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  postgres: ^3.5.5
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4
  provider: ^6.1.5
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.4.0
  intl: ^0.20.2
  uuid: ^4.5.1
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.13.1
  sqflite_common_ffi: ^2.4.0+2

flutter:
  uses-material-design: true

  assets:
    - .env
